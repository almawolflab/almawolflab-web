<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AlmaWolf Lab — Versiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#EDECEB;color:#1C1C2E;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 24px}
.logo{margin-bottom:48px}
.logo img{display:block;height:40px}
h1{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#6B7280;margin-bottom:32px}
.list{list-style:none;display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.list a{
  display:flex;justify-content:space-between;align-items:center;
  background:#fff;border:1px solid #D5D4D2;border-radius:8px;
  padding:16px 20px;text-decoration:none;color:#1C1C2E;
  font-size:14px;font-weight:500;transition:border-color .15s;
}
.list a:hover{border-color:#C13B2F}
.list a .v{font-weight:300;color:#6B7280;font-size:13px}
.list a.archived{opacity:.6}
</style>
</head>
<body>
<div class="logo">
  <img src="v1/Logo-AlmawolfLab.svg" alt="AlmaWolf Lab">
</div>
<h1>Versiones publicadas</h1>
<ul class="list">
  <li><a href="v1/"><span>V1 — Landing + Proyecto HER</span><span class="v">v1</span></a></li>
</ul>
</body>
</html>
